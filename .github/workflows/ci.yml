name: CFD checks
"on": [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  rust:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        toolchain: ["1.88.0", stable]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.toolchain }}
          components: rustfmt, clippy
      - if: matrix.toolchain == 'stable'
        run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --release --workspace --locked
  python-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install ruff==0.16.9
      - run: ruff format --check .
      - run: ruff check .
  numerical:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: cargo build --release --locked
      - run: python -m pip install -r requirements-validation.txt
      - run: mkdir -p runs
      - run: python validation/test_cli.py -v
      - run: python -O validation/test_cli.py -v
      - run: python validation/flow_accuracy.py --output runs/flow-accuracy
      - run: python validation/run_suite.py --output runs/verification
      - run: python validation/cavity.py --output runs/cavity
      - run: python validation/scipy_reference.py --output runs/scipy-reference
      - run: python tutorials/source_inference.py --output runs/inference
      - run: python tutorials/canyon_study.py --preset smoke --output runs/canyons
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: numerical-evidence
          path: |
            runs/**/report.json
            runs/**/summary.json
            runs/**/*.png
  native-adapter:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        toolchain: ["1.88.0", stable]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.toolchain }}
          components: rustfmt, clippy
      - if: matrix.toolchain == 'stable'
        run: cargo fmt --manifest-path integrations/fcmaes-cfd-worker/Cargo.toml -- --check
      - run: cargo clippy --locked --all-targets --manifest-path integrations/fcmaes-cfd-worker/Cargo.toml -- -D warnings
      - run: cargo build --release --locked --manifest-path integrations/fcmaes-cfd-worker/Cargo.toml
      - run: integrations/fcmaes-cfd-worker/target/release/fcmaes-cfd-worker describe > adapter-description.json
      - run: python3 -c "import json; d = json.load(open('adapter-description.json')); assert d['examples'], d"
  runner-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: dietmarwo/optimization-jobs
          # optimization-run 0.4.0 plus the structured-tutorial series; the revision tested here.
          ref: cc6b03d594f73d1f3b38f088e7e3bd8663814d75
          path: optimization-jobs
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: cargo build --release --locked
      - run: cargo build --release --locked --manifest-path integrations/fcmaes-cfd-worker/Cargo.toml
      - run: cargo build --release --locked --manifest-path optimization-jobs/Cargo.toml -p optimization-runner
      - run: python -m pip install -r requirements-validation.txt
      - run: mkdir -p runs && python integrations/run_jobs.py --runner optimization-jobs/target/release/optimization-run --output runs/jobs
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: runner-integration
          path: runs/jobs/report.json
