name: CFD checks
"on": [workflow_dispatch]
permissions:
  contents: read
jobs:
  explore:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - iterations: 10000
            stages: 2
          - iterations: 6000
            stages: 4
    env:
      CFD_OPENFOAM_ROOT: ${{ github.workspace }}/runs/openfoam13/runtime/opt/openfoam13
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements-validation.txt
      - run: mkdir -p runs && python integrations/install_openfoam13.py --output runs/openfoam13
      - run: lscpu | grep -E "Model name|^CPU\(s\)" | sed 's/^/::notice title=runner::/'
      - run: python validation/backstep_data.py --output runs/measurements
      - run: |
          set +e
          python tutorials/backstep_resolution.py --preset smoke --iterations ${{ matrix.iterations }} --max-stages ${{ matrix.stages }} --timeout-s 3500 --data runs/measurements --foam-root "$CFD_OPENFOAM_ROOT" --output runs/staged
          echo "::notice title=exit::$?"
      - if: always()
        run: python stage_notices.py runs/staged
