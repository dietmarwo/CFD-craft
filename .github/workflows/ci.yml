name: CFD checks
"on":
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      external:
        description: "External work: all existing checks, backend, resolution, mapping, refinement (accepted level 1, then up to three mapped/continued level-2 stages), or comparison (same-host cavity timing of both backends)"
        type: choice
        options: [all, backend, resolution, mapping, refinement, comparison]
        default: all
permissions:
  contents: read
jobs:
  external-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements-validation.txt
      - run: python validation/test_openfoam.py -v
      - run: python -O validation/test_openfoam.py -v
      - run: python validation/test_resolution.py -v
      - run: python -O validation/test_resolution.py -v
      - run: python validation/test_restart.py -v
      - run: python -O validation/test_restart.py -v
      - run: python validation/test_mapping.py -v
      - run: python -O validation/test_mapping.py -v
      - run: python validation/test_refinement.py -v
      - run: python -O validation/test_refinement.py -v
      - run: python validation/test_compare_backends.py -v
      - run: python -O validation/test_compare_backends.py -v
  external-backend:
    if: github.event_name == 'workflow_dispatch' && (inputs.external == 'all' || inputs.external == 'backend')
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      CFD_OPENFOAM_ROOT: ${{ github.workspace }}/runs/openfoam13/runtime/opt/openfoam13
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release --locked
      - run: python -m pip install -r requirements-validation.txt
      - run: mkdir -p runs && python integrations/install_openfoam13.py --output runs/openfoam13
      # Each runner prints failing tests as error annotations, with their tracebacks.
      - run: python validation/unittest_notices.py validation/test_openfoam.py
      - run: python validation/unittest_notices.py validation/test_openfoam.py -O
      - run: python validation/unittest_notices.py validation/test_resolution.py
      - run: python validation/unittest_notices.py validation/test_resolution.py -O
      - run: python validation/unittest_notices.py validation/test_restart.py
      - run: python validation/unittest_notices.py validation/test_restart.py -O
      - run: python validation/unittest_notices.py validation/test_mapping.py
      - run: python validation/unittest_notices.py validation/test_mapping.py -O
      - run: python validation/unittest_notices.py validation/test_refinement.py
      - run: python validation/unittest_notices.py validation/test_refinement.py -O
      # The cavity mapped from level 1 against a cold level-2 control, with the bounds
      # of the mapping results. Exit 2 records unaccepted evidence.
      - run: |
          set +e
          python validation/mapping_equivalence.py --foam-root "$CFD_OPENFOAM_ROOT" --timeout-s 180 --output runs/mapping-cavity
          code=$?
          test ! -f runs/mapping-cavity/report.json || python validation/external_notices.py runs/mapping-cavity/report.json "mapping cavity"
          test "$code" -eq 0 -o "$code" -eq 2
      - run: lscpu | grep -E "Model name|^CPU\(s\)" | sed 's/^/::notice title=runner::/'
      # The study preset: the cavity comparison and the backstep at three mesh levels,
      # each with the recorded 300-second budget. Exit 2 records unaccepted evidence;
      # exit 1 is a workflow error and fails the job.
      - run: |
          set +e
          python tutorials/external_cfd.py --preset study --timeout-s 300 --foam-root "$CFD_OPENFOAM_ROOT" --output runs/external-study
          code=$?
          test "$code" -eq 0 -o "$code" -eq 2
      - if: always()
        run: python validation/external_notices.py runs/external-study/report.json
      # Fixed-work continuation of the wall-resolved level-1 backstep (simple profile):
      # 250 iterations, 250 more from the stored fields, against 500 uninterrupted.
      - run: |
          set +e
          python validation/restart_equivalence.py --case backstep --solver-profile simple --first 250 --second 250 --timeout-s 600 --data runs/external-study/measurements --foam-root "$CFD_OPENFOAM_ROOT" --output runs/equivalence-simple
          code=$?
          python validation/external_notices.py runs/equivalence-simple/report.json "equivalence simple"
          test "$code" -eq 0 -o "$code" -eq 2
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: external-study-evidence
          path: |
            runs/external-study/report.json
            runs/external-study/cavity-comparison.json
            runs/external-study/native-cavity/summary.json
            runs/external-study/native-cavity.*.log
            runs/external-study/openfoam-cavity/summary.json
            runs/external-study/openfoam-cavity/*.log
            runs/external-study/backstep-level*/summary.json
            runs/external-study/backstep-level*/*.log
            runs/external-study/backstep-level*-comparison/*
            runs/equivalence-*/report.json
            runs/mapping-cavity/**
  # Same-host timing of the cavity with both backends; explicit opt-in only.
  backend-comparison:
    if: github.event_name == 'workflow_dispatch' && inputs.external == 'comparison'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CFD_OPENFOAM_ROOT: ${{ github.workspace }}/runs/openfoam13/runtime/opt/openfoam13
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release --locked
      - run: python -m pip install -r requirements-validation.txt
      - run: mkdir -p runs && python integrations/install_openfoam13.py --output runs/openfoam13
      - run: lscpu | grep -E "Model name|^CPU\(s\)" | sed 's/^/::notice title=runner::/'
      # One warmup per method, then two passes over all six orders. Any failed
      # run, changed input or unrepeated work fails the job.
      - run: |
          set +e
          python validation/compare_backends.py --foam-root "$CFD_OPENFOAM_ROOT" --repeats 2 --output runs/backend-comparison
          code=$?
          test ! -f runs/backend-comparison/report.json || python validation/external_notices.py runs/backend-comparison/report.json "cavity backends"
          test "$code" -eq 0
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: backend-comparison
          path: |
            runs/backend-comparison/report.json
            runs/backend-comparison/*/measurement.json
            runs/backend-comparison/*/native-result.json
  external-resolution:
    if: github.event_name == 'workflow_dispatch' && inputs.external != 'backend' && inputs.external != 'comparison'
    runs-on: ubuntu-24.04
    # Coarse reference + up to three fine executions, with audit/upload overhead.
    timeout-minutes: 360
    env:
      CFD_OPENFOAM_ROOT: ${{ github.workspace }}/runs/openfoam13/runtime/opt/openfoam13
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements-validation.txt
      - run: mkdir -p runs && python integrations/install_openfoam13.py --output runs/openfoam13
      - run: lscpu | grep -E "Model name|^CPU\(s\)" | sed 's/^/::notice title=runner::/'
      - run: python validation/backstep_data.py --output runs/measurements
      # The wall-resolved reference at level 1 in one run with the recorded budget, then
      # the same recipe in stages of 6000 iterations on the same runner. Exit 2 records
      # unaccepted evidence; exit 1 is a workflow error and fails the job.
      - run: |
          set +e
          python tutorials/backstep_resolution.py --preset smoke --iterations 20000 --timeout-s 3500 --data runs/measurements --foam-root "$CFD_OPENFOAM_ROOT" --output runs/resolution-study
          code=$?
          test "$code" -eq 0 -o "$code" -eq 2
      - if: always()
        run: test ! -f runs/resolution-study/report.json || python validation/external_notices.py runs/resolution-study/report.json
      - if: inputs.external == 'all' || inputs.external == 'resolution'
        run: |
          set +e
          python tutorials/backstep_resolution.py --preset smoke --iterations 6000 --max-stages 4 --timeout-s 3500 --data runs/measurements --foam-root "$CFD_OPENFOAM_ROOT" --output runs/resolution-staged
          code=$?
          test "$code" -eq 0 -o "$code" -eq 2
      - if: always() && (inputs.external == 'all' || inputs.external == 'resolution')
        run: test ! -f runs/resolution-staged/report.json || python validation/external_notices.py runs/resolution-staged/report.json
      # The staged chain's final stage against the single run: work, fields, audit and
      # measurement metrics, with the bounds of the continuation results.
      - if: inputs.external == 'all' || inputs.external == 'resolution'
        run: |
          set +e
          final=$(python -c "import json; print(json.load(open('runs/resolution-staged/report.json'))['rows'][0]['stages'][-1]['run_directory'])")
          python validation/compare_restart.py --run "runs/resolution-staged/$final" --control runs/resolution-study/wall-resolved-simplec-level1 --mode converged --data runs/measurements --output runs/staged-comparison.json > /dev/null
          code=$?
          python validation/external_notices.py runs/staged-comparison.json "staged against single run"
          test "$code" -eq 0 -o "$code" -eq 2
      # The accepted single run initializes level 2; a cold level-2 case is the control.
      # Both run 3000 iterations within 3500 s. Report only: no gate is applied.
      - if: inputs.external == 'all' || inputs.external == 'mapping'
        run: |
          set +e
          python validation/mapped_start.py --source runs/resolution-study/wall-resolved-simplec-level1 --iterations 3000 --timeout-s 3500 --data runs/measurements --foam-root "$CFD_OPENFOAM_ROOT" --output runs/mapped-start
          code=$?
          test ! -f runs/mapped-start/report.json || python validation/external_notices.py runs/mapped-start/report.json "mapped start level 2"
          test "$code" -eq 0
      # Explicit opt-in: keep this longer campaign out of the existing all budget.
      # A completed unaccepted campaign exits 2; an invalid workflow exits 1.
      - if: inputs.external == 'refinement'
        run: |
          set +e
          python validation/refinement_campaign.py --source runs/resolution-study/wall-resolved-simplec-level1 --iterations 4000 --max-stages 3 --timeout-s 3500 --preparation-s 900 --data runs/measurements --foam-root "$CFD_OPENFOAM_ROOT" --output runs/refinement-campaign
          code=$?
          test ! -f runs/refinement-campaign/report.json || python validation/external_notices.py runs/refinement-campaign/report.json "refinement level 2"
          test "$code" -eq 0 -o "$code" -eq 2
      - name: Archive complete refinement evidence
        if: always() && inputs.external == 'refinement'
        run: |
          python - <<'PY'
          from pathlib import Path
          import zipfile
          root = Path("runs/refinement-campaign")
          if root.is_dir():
              paths = sorted(root.rglob("*"))
              for path in [root, *paths]:
                  if path.is_symlink():
                      field = str(path.relative_to(root)) if path != root else "source"
                      raise ValueError(f"CFD-X015 refinement.archive.{field}: symlink rejected")
              with zipfile.ZipFile("runs/refinement-campaign-evidence.zip", "w", zipfile.ZIP_DEFLATED) as archive:
                  for path in paths:
                      archive.write(path, str(path.relative_to(root.parent)))
          PY
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: resolution-evidence
          path: |
            runs/resolution-study/report.json
            runs/resolution-study/wall-resolved-*/**
            runs/resolution-staged/report.json
            runs/resolution-staged/wall-resolved-*/**
            runs/staged-comparison.json
            runs/mapped-start/report.json
            runs/mapped-start/*-input/case.json
            runs/mapped-start/*/summary.json
            runs/mapped-start/*/*.log
            runs/refinement-campaign/report.json
            runs/refinement-campaign-evidence.zip
  rust:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        toolchain: ["1.88.0", stable]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.toolchain }}
          components: rustfmt, clippy
      - if: matrix.toolchain == 'stable'
        run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --release --workspace --locked
  python-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install ruff==0.16.9
      - run: ruff format --check .
      - run: ruff check .
  numerical:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: cargo build --release --locked
      - run: python -m pip install -r requirements-validation.txt
      - run: mkdir -p runs
      - run: python validation/test_benchmark_native.py -v
      - run: python -O validation/test_benchmark_native.py -v
      - run: cargo build --release --locked --example performance_probe
      - run: target/release/examples/performance_probe cases/verification/periodic-tracer.json pressure 2 2 1 json runs/native-pressure-probe.json
      # The paired runner against the real probe in every mode: a self-comparison
      # must agree exactly. No timing threshold is applied.
      - run: |
          for mode in setup pressure momentum production transport steps; do
            python validation/benchmark_native.py --baseline target/release/examples/performance_probe --candidate target/release/examples/performance_probe --case cases/canyon/wh1-wind270.json --mode $mode --rounds 1 --inner 2 --steps 2 --output runs/native-self-$mode
          done
      - run: python validation/test_cli.py -v
      - run: python -O validation/test_cli.py -v
      - run: python validation/flow_accuracy.py --output runs/flow-accuracy
      - run: python validation/run_suite.py --output runs/verification
      - run: python validation/cavity.py --output runs/cavity
      - run: python validation/scipy_reference.py --output runs/scipy-reference
      - run: python tutorials/source_inference.py --output runs/inference
      - run: python tutorials/canyon_study.py --preset smoke --output runs/canyons
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: numerical-evidence
          path: |
            runs/**/report.json
            runs/**/summary.json
            runs/**/*.png
  native-adapter:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        toolchain: ["1.88.0", stable]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.toolchain }}
          components: rustfmt, clippy
      - if: matrix.toolchain == 'stable'
        run: cargo fmt --manifest-path integrations/fcmaes-cfd-worker/Cargo.toml -- --check
      - run: cargo clippy --locked --all-targets --manifest-path integrations/fcmaes-cfd-worker/Cargo.toml -- -D warnings
      - run: cargo build --release --locked --manifest-path integrations/fcmaes-cfd-worker/Cargo.toml
      - run: integrations/fcmaes-cfd-worker/target/release/fcmaes-cfd-worker describe > adapter-description.json
      - run: python3 -c "import json; d = json.load(open('adapter-description.json')); assert d['examples'], d"
  runner-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: dietmarwo/optimization-jobs
          # optimization-run 0.4.0 plus the structured-tutorial series; the revision tested here.
          ref: cc6b03d594f73d1f3b38f088e7e3bd8663814d75
          path: optimization-jobs
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: cargo build --release --locked
      - run: cargo build --release --locked --manifest-path integrations/fcmaes-cfd-worker/Cargo.toml
      - run: cargo build --release --locked --manifest-path optimization-jobs/Cargo.toml -p optimization-runner
      - run: python -m pip install -r requirements-validation.txt
      - run: mkdir -p runs && python integrations/run_jobs.py --runner optimization-jobs/target/release/optimization-run --output runs/jobs
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: runner-integration
          path: runs/jobs/report.json
