# Publish the crates to crates.io (modeled on LP-IP-craft's publish-crates.yml).
# A tag vX.Y.Z must equal the workspace version. With the repository variable
# CRATES_IO_TRUSTED_PUBLISHING=true, a tag publishes through Trusted
# Publishing. Before that, the first release publishes with a crates.io API
# token in the secret CARGO_REGISTRY_TOKEN of the `release` environment
# (crates.io accepts Trusted Publishers only for existing crates); without
# either, the workflow validates and skips the upload. Pull requests that touch
# the crate manifests and manual runs validate only. See docs/developer/releasing.md.
name: Publish crates to crates.io

on:
  push:
    tags:
      - "v*"
  pull_request:
    paths:
      - ".github/workflows/publish-crates.yml"
      - "Cargo.toml"
      - "Cargo.lock"
      - "crates/**"
      - "scripts/check_release.py"
      - "scripts/package_version.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt
      - name: Check versions, crate metadata and lockfiles
        shell: bash
        run: |
          python3 scripts/check_release.py
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            test "$GITHUB_REF_NAME" = "v$(python3 scripts/package_version.py)"
          fi
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --release --workspace --locked
      - name: Verify the packages (each builds from its own archive)
        run: cargo publish -p cfd-craft -p cfd-craft-cli --dry-run --locked

  publish:
    needs: verify
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write
    env:
      CRATES: cfd-craft cfd-craft-cli
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Look for a first-release token
        id: bootstrap
        if: vars.CRATES_IO_TRUSTED_PUBLISHING != 'true'
        shell: bash
        env:
          TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          if [ -n "$TOKEN" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
            echo "Publishing with the CARGO_REGISTRY_TOKEN secret."
          else
            echo "::error::A release tag needs Trusted Publishing (CRATES_IO_TRUSTED_PUBLISHING=true)"
            echo "::error::or the CARGO_REGISTRY_TOKEN secret of the release environment."
            exit 1
          fi
      - name: Publish the first release with the token
        if: vars.CRATES_IO_TRUSTED_PUBLISHING != 'true' && steps.bootstrap.outputs.present == 'true'
        shell: bash
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          # One crate at a time in dependency order, skipping versions already
          # on crates.io, so a rerun after a partial upload completes it.
          version="$(python3 scripts/package_version.py)"
          for crate in $CRATES; do
            if curl -sf -o /dev/null -A "CFD-craft release workflow (https://github.com/dietmarwo/CFD-craft)" \
                "https://crates.io/api/v1/crates/$crate/$version"; then
              echo "$crate $version is already on crates.io"
            else
              cargo publish -p "$crate" --locked
            fi
          done
      - name: Obtain a short-lived crates.io token
        if: vars.CRATES_IO_TRUSTED_PUBLISHING == 'true'
        id: auth
        uses: rust-lang/crates-io-auth-action@v1
      - name: Publish the crates in dependency order
        if: vars.CRATES_IO_TRUSTED_PUBLISHING == 'true'
        run: cargo publish -p cfd-craft -p cfd-craft-cli --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
