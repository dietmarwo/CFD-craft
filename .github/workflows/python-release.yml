# Build, test and publish the cfd-craft Python package (modeled on
# LP-IP-craft's python-release.yml). The extension is built for the stable
# ABI (abi3, CPython 3.10+), so each platform needs one wheel; every wheel and
# the source distribution run the installed-package acceptance
# (validation/check_installed.py) outside the checkout, on the oldest and the
# newest supported Python, normally and under -O. A tag vX.Y.Z publishes
# through PyPI Trusted Publishing (see docs/developer/releasing.md); pull requests that touch
# the packaging and manual runs build and test only.
name: Build and publish cfd-craft for Python

on:
  push:
    tags:
      - "v*"
  pull_request:
    paths:
      - ".github/workflows/python-release.yml"
      - "pyproject.toml"
      - "python/**"
      - "bindings/python/**"
      - "crates/cfd-craft/**"
      - "scripts/package_version.py"
      - "scripts/check_release.py"
      - "validation/check_installed.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Require consistent versions (and the tag to match them)
        shell: bash
        run: |
          python scripts/check_release.py
          version="$(python scripts/package_version.py)"
          echo "version $version"
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            test "$GITHUB_REF_NAME" = "v$version"
          fi

  build:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux-x86_64, runner: ubuntu-22.04, target: x86_64 }
          - { name: windows-x64, runner: windows-latest, target: x64 }
          - { name: macos-x86_64, runner: macos-15-intel, target: x86_64 }
          - { name: macos-aarch64, runner: macos-latest, target: aarch64 }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Build the abi3 wheel
        uses: PyO3/maturin-action@v1
        with:
          maturin-version: "1.9.6"
          target: ${{ matrix.target }}
          args: --release --locked --out dist
          manylinux: auto
      - uses: actions/upload-artifact@v6
        with:
          name: wheels-${{ matrix.name }}
          path: dist

  test:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        platform:
          - { name: linux-x86_64, runner: ubuntu-22.04 }
          - { name: windows-x64, runner: windows-latest }
          - { name: macos-x86_64, runner: macos-15-intel }
          - { name: macos-aarch64, runner: macos-latest }
        python-version: ["3.10", "3.14"]
    runs-on: ${{ matrix.platform.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/download-artifact@v7
        with:
          name: wheels-${{ matrix.platform.name }}
          path: dist
      - name: Install the wheel and run the installed-package acceptance
        shell: bash
        run: |
          python -m pip install --no-index --no-deps --find-links dist cfd-craft
          version="$(python scripts/package_version.py)"
          cd "$RUNNER_TEMP"
          python -I -c "import cfd_craft; assert cfd_craft.__version__ == '$version', cfd_craft.__version__"
          python -I "$GITHUB_WORKSPACE/validation/check_installed.py" --output installed.json
          python -I -O "$GITHUB_WORKSPACE/validation/check_installed.py" --output installed-optimized.json
          diff installed.json installed-optimized.json

  sdist:
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
      - name: Build the source distribution
        uses: PyO3/maturin-action@v1
        with:
          maturin-version: "1.9.6"
          command: sdist
          args: --out dist
      - name: Build from the source distribution and run the acceptance
        shell: bash
        run: |
          python -m pip install dist/*.tar.gz
          cd "$RUNNER_TEMP"
          python -I "$GITHUB_WORKSPACE/validation/check_installed.py" --output installed.json
      - uses: actions/upload-artifact@v6
        with:
          name: wheels-sdist
          path: dist

  release:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    needs: [test, sdist]
    environment: release
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@v7
      - name: Generate artifact attestations
        uses: actions/attest@v4
        with:
          subject-path: "wheels-*/*"
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: false
      - name: Publish with PyPI Trusted Publishing
        run: uv publish --trusted-publishing always "wheels-*/*"
