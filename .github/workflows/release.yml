name: Prepare and publish release
on:
  workflow_dispatch:
    inputs:
      version:
        description: Version without v (must match all manifests)
        required: true
        default: '0.1.0'
      publish:
        description: Publish from the matching vVERSION tag after all gates pass
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  checks:
    uses: ./.github/workflows/ci.yml
  source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@stable
      - run: python scripts/check_release.py --version "$RELEASE_VERSION"
        env:
          RELEASE_VERSION: ${{ inputs.version }}
      - name: Require a matching tag for publication
        if: inputs.publish
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: test "$GITHUB_REF" = "refs/tags/v$RELEASE_VERSION"
      - run: cargo package --workspace --locked
      - run: python -m pip install maturin==1.9.6 twine
      - run: maturin sdist --out dist
      - run: git diff --exit-code -- Cargo.lock bindings/python/Cargo.lock
      - run: python -m twine check dist/*.tar.gz
      - run: python scripts/check_sdist.py dist/*.tar.gz --output release-check/sdist
      - uses: actions/upload-artifact@v4
        with:
          name: source
          path: |
            dist/*.tar.gz
            target/package/*.crate
            release-check/sdist/*.json
  wheel:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: macos-14
            target: aarch64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: PyO3/maturin-action@v1
        with:
          maturin-version: 'v1.9.6'
          rust-toolchain: '1.88.0'
          target: ${{ matrix.target }}
          manylinux: '2014'
          args: --release --locked --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ matrix.os }}
          path: dist/*.whl
  installed:
    needs: wheel
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14, windows-latest]
        python: ['3.10', '3.12', '3.14']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/download-artifact@v4
        with:
          name: wheel-${{ matrix.os }}
          path: dist
      - shell: bash
        run: python -m pip install dist/*.whl
      - shell: bash
        working-directory: ${{ runner.temp }}
        run: |
          python -I "$GITHUB_WORKSPACE/validation/check_installed.py" --output installed.json
          python -I -O "$GITHUB_WORKSPACE/validation/check_installed.py" --output installed-optimized.json
          diff installed.json installed-optimized.json
      - uses: actions/upload-artifact@v4
        with:
          name: acceptance-${{ matrix.os }}-${{ matrix.python }}
          path: ${{ runner.temp }}/installed*.json
  pypi:
    needs: [checks, source, installed]
    if: inputs.publish
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: source
          path: source
      - uses: actions/download-artifact@v4
        with:
          pattern: wheel-*
          merge-multiple: true
          path: dist
      - run: cp source/dist/*.tar.gz dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
  crates:
    needs: [checks, source, installed]
    if: inputs.publish
    runs-on: ubuntu-latest
    environment: crates-io
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Publish in dependency order (Cargo waits for the index)
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          cargo publish --locked -p cfd-craft
          cargo publish --locked -p cfd-craft-cli
