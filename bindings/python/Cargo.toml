[workspace]
[package]
name = "cfd-craft-python"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
publish = false
[lib]
name = "_native"
crate-type = ["cdylib"]
[dependencies]
cfd-craft = { path = "../../crates/cfd-craft", version = "0.1.0" }
pyo3 = { version = "=0.29.0", features = ["extension-module", "abi3-py310"] }
rayon = "1"
serde_json = { version = "1", features = ["float_roundtrip"] }
schemars = "0.8"
[build-dependencies]
sha2 = "0.10"
